apiVersion: v1
kind: Pod
metadata:
  name: pawbench-t020
  namespace: default
spec:
  restartPolicy: Never
  # 若集群有多个节点，把下面这行取消注释并改成“你放数据的那台节点”
  # 的真实名称（kubectl get nodes 查），否则 Pod 可能被调度到没有该
  # hostPath 的节点上而启动失败。
  # nodeName: labest-m1
  containers:
    - name: runner
      image: registry.cic.cmbchina.cn/inference/qwenclawbench-qwenpaw:2.2.0
      imagePullPolicy: Always
      workingDir: /opt/copawbench
      env:
        # ★ 关键：启用本地（进程内）模式，跳过所有 Docker 操作（不再需要
        #   docker.sock / docker CLI / dind / 任何宿主 docker 依赖）
        - name: PAWBENCH_ENV
          value: "local"
        - name: PYTHONPATH
          value: "/opt/copawbench"
        # 执行模型（custom provider 自动补 /v1，base 上不要写 /v1）
        - name: CUSTOM_BASE_URL
          value: "http://open-llm.uat.cmbchina.cn/llm/qwen3p6-35b-a3b"
        - name: CUSTOM_API_KEY
          value: "<YOUR_API_KEY>"
        # 评测模型（grader 不会补 /v1，必须带 /v1）
        - name: JUDGE_BASE_URL
          value: "http://open-llm.uat.cmbchina.cn/llm/qwen3p6-35b-a3b/v1"
        - name: JUDGE_API_KEY
          value: "<YOUR_API_KEY>"
        # 与本地评测保持一致，规避 Qwen3.6 推理模型（先流式吐
        # reasoning_content，content 滞后）导致的 StreamIdleTimeoutError。
        - name: QWENPAW_LLM_STREAM_IDLE_TIMEOUT
          value: "600"
        - name: AUTO_EVAL_GENERATE_KWARGS
          value: '{"extra_body":{"enable_thinking":false}}'
      # 跑完后把 agent 侧日志拷进 /results（已挂 hostPath），
      # 否则容器一退出 /tmp 里的日志就看不到了。
      # 模型名必须与 URL 路径里的部署名完全一致（qwen3p6-35b-a3b，是 p 不是点）。
      command: ["bash", "-lc"]
      args:
        - |
          python /opt/copawbench/run_bench.py \
            --agents qwenpaw \
            --docker-image registry.cic.cmbchina.cn/inference/qwenclawbench-qwenpaw:2.2.0 \
            --model custom/qwen3p6-35b-a3b \
            --judge qwen3p6-35b-a3b \
            --tasks T020 \
            --results-dir /results
          echo "=== run_bench exit=$? ==="
          mkdir -p /results/_logs
          cp -a /tmp/qwenpaw_server.log /tmp/qwenpaw_output.txt /tmp/task_instruction.txt /results/_logs/ 2>/dev/null || true
          ls -la /results/_logs
      volumeMounts:
        - name: results
          mountPath: /results
        # 任务数据：镜像里没有 data/，用 hostPath 补上。
        # 注意层级：代码找的是 /opt/copawbench/data/pawbench-v1.0/tasks
        # （backend.py:161: benchmark_path / "data" / ds / "tasks"），
        # 所以这里必须挂到 .../data/pawbench-v1.0，不能只挂到 .../data。
        - name: taskdata
          mountPath: /opt/copawbench/data/pawbench-v1.0
        # 调试期用：把改过的 pawbench 代码挂进去，覆盖镜像里的同名目录，
        # 这样改代码不用重建镜像。验证通过后可去掉这个挂载并重建镜像固化。
        - name: pawcode
          mountPath: /opt/copawbench/pawbench
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "8"
          memory: "16Gi"
  volumes:
    - name: results
      hostPath:
        # 落盘到宿主机，Pod 结束后仍可查看结果与 agent 日志
        path: /home/ops/lj/lx/results
        type: DirectoryOrCreate
    - name: taskdata
      hostPath:
        # 必须同时包含 tasks/(150 个任务 md) 和 assets/(1017 个素材文件)
        path: /home/ops/lj/lx/pawbench-v1.0
        type: Directory
    - name: pawcode
      hostPath:
        # 仓库里的 pawbench/ 代码目录（含修复后的 qwenpaw_agent.py）
        path: /home/ops/lj/lx/PawBench/pawbench
        type: Directory
